# 组织架构唯一事实源（ORG-DESIGN v2.2，制作人 2026-09-29 定稿）
# 铁律：派出人是起点和终点（派单人终验收）；批/干错位一格分权；高级别管低级别+交叉+联签。
# 分工：框架=agent 人事与干活（本文件）；YouTrack=流程流转（单据字段：部门/等级/派单人/父单）。
version: 1
projects:
  STUDIO:                        # 2 级团队（制作人确认：无中层，慢慢扩）
    team_level: 2
    leader: {name: 宰相(ZCode), level: 2, 上级: opengames}
    bu:                           # 执行层职能组（2 级团队=职能分组，非独立中层）
      工程部: {主管: 宰相(ZCode), 上级: [宰相(ZCode)], 职能: 开发/修bug/重构, 泳道: [explore]}
      质量部: {主管: 自评引擎, 上级: [宰相(ZCode)], 职能: 测试/复盘/案例库/报告, 汇报面: true}
      情报部: {主管: 巡逻引擎, 上级: [宰相(ZCode)], 职能: 前沿扫描/知识库/评估}
    agents:                       # 人事档案（框架侧职责：身份/多部门/定时任务/上级）
      宰相(ZCode):
        {level: 2, 部门: [工程部], 角色: 首席进化官/宰相, 上级: opengames, 定时: 框架持续推进岗(每4h)}
      自评引擎:
        {level: 1, 部门: [质量部], 角色: 质量部主管, 上级: 宰相(ZCode), 定时: self-eval(每日08:50)}
      巡逻引擎:
        {level: 1, 部门: [情报部], 角色: 情报部主管, 上级: 宰相(ZCode), 定时: patrol(每小时05分)}
      worker池:
        {level: 1, 部门: [工程部], 角色: 施工执行, 上级: 宰相(ZCode), 身份: agent-dev}
    approvals:                    # 分权引擎配置
      engine: shadow              # 影子期启动（制作人 09-29 定则：零分歧 3 天切 org；legacy 保留可回滚）
      派单人终验收: true           # 铁律（定死）
      producer_level: 9           # 9 必亲批；8 制作人保留关注
      producer_watch_level: 8
      全流程签字: {阈值: 4}        # STUDIO-79（宪章§12.2）：等级≥4 单七环逐环签字
                                  # （理解→拆分→方案→执行→测试→回归→merge），终验前置校验
      批干矩阵:                    # 每层「干 [X,X+2]，批 [X-1,X+1]」
        - {层: 高层, 干: [7,9], 批: [6,8], 派: [6,8]}
        - {层: 中层, 干: [4,6], 批: [3,5], 派: [3,5]}
        - {层: 执行, 干: [1,3], 批: [1,2], 派: []}
      渐进启用: [1, 2]            # 当前启用等级段（制作人：从低往高逐步拓展）
      exemptions:                  # 兼容旧三机制（P2 起作为引擎特例）
        - {范围: STUDIO 全部, 规则: 宰相可批<9 且非制作人派出单（制作人 09-29 全权授权）}
        - {范围: GAMES 业务单, 规则: GAMES 专岗无条件}
        - {范围: POLY core 泳道, 规则: 全等级制作人亲批}
        - {范围: 任何单, 规则: 制作人评论「亲批」即锁定亲批}

# ── 账号=等级（制作人 2026-09-29 定则：免费版 10 账号，除制作人外 9 个恰好映射 9 级）──
# 账号是等级权限锚点（YouTrack 原生权限按账号配——平台级强制，不重复造轮子）；
# 个体身份靠评论署名协议：正文前缀 [项目·名字·部门]（账号=等级，同名不同个体的定位）。
accounts:                        # login → 等级上限（干/批按批干矩阵另算）
  agent-9: 9                # 最高位 agent：宰相代批/高层执行（制作人 9 级单的执行侧）
  agent-8: 8                    # PM 治理（引擎宿主账号，daemon 系统动作用它）
  agent-7: 7             # 审查
  agent-6: 6              # 策划
  agent-5: 5                # 美术
  agent-4: 4                    # QA
  agent-3: 3                 # 情报/探索
  agent-2: 2                  # core 施工
  agent-1: 1                  # game 施工
署名协议: "[项目·个体名·部门] 正文"   # 一切 agent 评论必带（YouTrack author=等级账号，署名=个体）
# 权限落地（P2 实施）：YouTrack 项目角色按等级递减——低等级账号对高危状态无命令权限，
# 平台层先拦一道，代码引擎（org 分权）再拦一道，双保险。
