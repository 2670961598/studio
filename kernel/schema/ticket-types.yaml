# 单子知识库 —— 类型×流转的唯一事实源（所有 agent 与 daemon 每次读取）
# 修改方式：evolve-schema 流程（内部改进单提案 → 制作人 approve → daemon 自动应用+git commit）
# 红线：states 全集与 YouTrack State bundle 对齐；专用流类型不走轨道制；新类型必须有 定位/目的/流转

version: 1
updated: "2026-09-16 04:00"

states: [草稿, 新单, 排期待审, 方案待审, 已排期, 开发中, 待测试, 测试中, 代码待审,
         待合并, 已批准, 合并中, 合并验证, 待终验收, 已关闭, 已取消,
         研究中, 报告待审, 已归档, 触发, 止血中, 待复盘, 复盘中]

common_edges:            # 轨道制类型共享（含退回边）
  - [开发中, 待测试]
  - [待测试, 测试中]
  - [已批准, 合并中]
  - [合并中, 合并验证]
  - [合并验证, 已关闭]
  - [开发中, 已排期]     # 退回（attempt+1 重派）
  - [测试中, 已排期]
  - [合并中, 已排期]
  - [合并验证, 已排期]

track_edges:
  "A 特护": [[新单, 排期待审], [排期待审, 方案待审], [方案待审, 已排期],
             [测试中, 代码待审], [代码待审, 已批准], [合并验证, 待终验收], [待终验收, 已关闭]]
  "B 常规": [[新单, 排期待审], [排期待审, 已排期], [测试中, 待合并], [待合并, 已批准]]
  "C 轻轨": [[新单, 已排期], [测试中, 已批准]]   # 免审；永不自动 push

type_edges:              # 专用流类型（不走轨道制）
  情报: [[草稿, 新单], [新单, 研究中], [研究中, 报告待审], [报告待审, 已归档]]
  事故: [[触发, 止血中], [止血中, 待复盘], [待复盘, 复盘中], [复盘中, 已关闭]]
  战役: [[新单, 研究中]]                        # 永驻巡逻；唯一终点=已取消

types:
  核心:   {定位: 架构/共享代码/数据迁移, 目的: 高风险改动，特护跟全程, 轨道: "A/B/C", 执行: agent-dev, 流转: 轨道制}
  业务:   {定位: 玩法/功能实现, 目的: 常规交付, 轨道: "A/B/C", 执行: agent-dev, 流转: 轨道制}
  缺陷:   {定位: 已知问题修复, 目的: 回归绿, 轨道: "A/B/C", 执行: agent-dev, 流转: 轨道制}
  策划:   {定位: 设计文档, 目的: 产出表路径+验收公式, 轨道: "A/B/C", 执行: agent-designer, 流转: 轨道制, 闸门: 文档门}
  美术:   {定位: 资源产出, 目的: 过命名/引用/导入检查, 轨道: "A/B/C", 执行: agent-artist, 流转: 轨道制, 闸门: 资产门}
  技术债: {定位: Inspector/QA 发现的债务, 目的: 量化偿还, 轨道: "B/C", 起点: 草稿, 执行: agent-dev, 流转: 轨道制}
  内部改进: {定位: 工作室自身进化, 目的: 改手册/参数/schema, 轨道: "C", 执行: agent-dev, 流转: 轨道制}
  Epic:   {定位: 一次性拆解母单, 目的: ≤5 子单 DAG 后关闭, 轨道: "B", 执行: pm拆解, 流转: 轨道制}
  情报:   {定位: 外部动向, 目的: 归档进 intel 库供决策, 流转: 专用, 执行: agent-scout}
  事故:   {定位: 线上/循环事故, 目的: 止血+复盘, 流转: 专用, 执行: agent-pm}
  战役:   {定位: 永驻巡逻母亲单, 目的: 定向跟踪主题（前沿/性能），周期对比基准，持续孵化子单, 流转: 专用, 执行: patrol引擎, 巡逻: true}
