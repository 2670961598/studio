# 单子知识库 v2 —— 五族分类 × AI 原生状态流 × 影响级别（唯一事实源，全员每读）
# 原则：
#   1. 状态 = 机器可验证的事实（已派发=进程存在；证据就绪=REPORT+run-gate 绿），不是人的心情词
#   2. 状态迁移只由 daemon 依机器事件推进；待批只由制作人评论推进
#   3. 级别（字段沿用"轨道"）= 介入深度旋钮：交付族 L0-L3 管审批次数；治理族 G1-G4 管变更重量
#   4. 同一状态可在一条流里出现两次（如 L3 的两个待批），语义由位置+批示指令区分
#   5. 修改本文件走 evolve-schema（治理族提案单）→ 制作人 approve

version: 2
updated: "2026-09-16 05:30"

states: [新单, 待批, 已派发, 证据就绪, 复验通过, 已交付, 已取消,
         草稿, 实施中, 观察窗, 结案,
         待答, 已答, 已沉淀, 发现, 评估中, 已归档,
         运行中, 暂停, 止血中, 复盘中, 分析中, 决议, 已关闭,
         排期待审, 方案待审, 已排期, 开发中, 待测试, 测试中, 代码待审,
         待合并, 已批准, 合并中, 合并验证, 待终验收, 研究中, 报告待审,
         触发, 待复盘]   # 后两段为旧态，保留给历史单，新单不再使用

levels:                      # 影响级别（YouTrack 字段沿用"轨道"）
  交付:
    "L0 自动": {审批: [], 说明: 纯文档/格式/无逻辑，全自动到已交付，push 累积等版本日}
    "L1 首批": {审批: [立项], 说明: 立项批一次，之后全自动交付}
    "L2 常规": {审批: [立项, 合并], 说明: 标准两批}
    "L3 特护": {审批: [立项, 方案, 合并+终验], 说明: 方案先行两段派发，终验收清单，可附 push 授权}
  治理:
    "G1 知识": {审批: [一次approve], 说明: kb 内容变更，git 可秒回滚}
    "G2 类型": {审批: [一次approve], 说明: 新增/改单子类型，附状态流校验}
    "G3 编制": {审批: [approve+24h冷静期复核], 说明: 增删岗位/权限/预算}
    "G4 红线": {审批: [approve+24h冷静期复核], 说明: 公约/红线/审批规则本身}

families:
  交付: {一句话: agent 干活的变动, 执行: claude worker, 级别: 交付}
  知识: {一句话: 发散与沉淀，不进交付队列, 级别: 无}
  治理: {一句话: 工作室框架的变动，统一提案流, 级别: 治理}
  运营: {一句话: 长期永驻巡逻, 级别: 无}
  事件: {一句话: 急事特殊通道, 级别: 无}

types:
  需求:   {族: 交付, 定位: 做东西进仓库（原核心/业务/策划/美术合并）, 工种: 程序|策划|美术（路由 worker）, 流转: 按级别}
  缺陷:   {族: 交付, 定位: 修坏的，须回链引入源, 流转: 按级别}
  技术债: {族: 交付, 定位: 还欠的（Inspector/QA 来源）, 流转: 按级别, 默认级别: "L1 首批"}
  疑问:   {族: 知识, 定位: 问清楚（任何成员可开，PM 代开须署名）, 流转: [新单, 待答, 已答, 已沉淀]}
  情报:   {族: 知识, 定位: 知道了（外部发现）, 流转: [发现, 评估中, 已归档]}
  提案:   {族: 治理, 定位: 改框架的唯一载体（evolve-schema/kb-propose/roster-propose 三指令）, 流转: [草稿, 待批, 实施中, 观察窗, 结案], 级别: 治理}
  复盘:   {族: 治理, 定位: 从事故与断路学习，结论转提案, 流转: [新单, 分析中, 决议, 结案]}
  战役:   {族: 运营, 定位: 永驻巡逻孵化子单, 流转: [新单, 运行中, 暂停], 终点: [已取消]}
  事故:   {族: 事件, 定位: 急事通道，关闭前必须挂复盘单, 流转: [发现, 止血中, 复盘中, 已关闭]}

# 交付族按级别状态流（flow_by_level）
flow_by_level:
  "L0 自动":    [新单, 已派发, 证据就绪, 复验通过, 已交付]
  "L1 首批":    [新单, 待批, 已派发, 证据就绪, 复验通过, 已交付]
  "L2 常规":    [新单, 待批, 已派发, 证据就绪, 复验通过, 待批, 已交付]
  "L3 特护":    [新单, 待批, 已派发, 证据就绪, 待批, 已派发, 证据就绪, 复验通过, 待批, 已交付]
                 # L3 两段派发：第一段=方案文档（证据就绪后待批=方案审），
                 # 批后重新派发做实现；RENDER 时用序号区分同名态

type_edges:                 # 非交付族的专属边
  疑问: [[新单, 待答], [待答, 已答], [已答, 已沉淀]]
  情报: [[发现, 评估中], [评估中, 已归档]]
  提案: [[草稿, 待批], [待批, 实施中], [实施中, 观察窗], [观察窗, 结案]]
  复盘: [[新单, 分析中], [分析中, 决议], [决议, 结案]]
  战役: [[新单, 运行中], [运行中, 暂停], [暂停, 运行中]]
  事故: [[发现, 止血中], [止血中, 复盘中], [复盘中, 已关闭]]

# 交付族边集由 flow_by_level 展开生成（相邻即边）+ 退回边（证据就绪→已派发 重做，attempt+1）
rollback_edges: [[证据就绪, 已派发], [复验通过, 已派发]]
