    model_tier: low
    budget_cap: 1 # USD/次
  - id: daily-report-产品策划部
    dept: departments/产品策划部 # 所属部门节点
    cron: "0 18 * * *" # 本地时区
    role: 产品策划部长 # 岗位
    level: 5 # 该岗等级
    type: report # 任务类型（report | audit | ...，自由扩展，框架不写死）
    model_tier: low # 模型档：high | mid | low
    budget_cap: 2 # 预算帽（USD/次；预留-结算，超额在调用前拒绝）
    output: reports/产品策划部/ # 产出落点（报表按 <date>-<type>-<节点>-<总结>.md 命名）
  - id: health-patrol-人事部
