# Studio Next · 公司组织配置（org-config.yaml）—— company-5-level（部门化骨架）
#
# 逐级部门表依据：docs/33-§3（L5 部门化）；生成器 packages/company/src/gen-template.ts
# （结构源=level-specs.ts，花名种子=company-5-level 冻结——手改本文件会被再生成覆盖）
# 契约依据：docs/04-公司目录与等级体系.md §二；校验规则见 packages/company zod schema。
#
# 骨架口径（双口径）：编制目标 100-250 人、跨度 5-8——本模板只放 13 名
# 骨架（负责人＋单岗＋代表执行）；填满编制归 company create 向导（docs/36-§4 M-B）。
# 示范要点：工程/质量/产品策划/人事/财务五职能部＋综合部（对外与战略情报单岗）

schema: studio-next/org@1 # 本文件的 schema 版本（须与 .studio-next.yaml 的 schema 一致）

company:
  name: 示例公司 # 公司名（init 替换占位）
  slug: example-corp # 目录 slug（init 替换占位）；概览路由 http://<host>:8789/<slug>/...
  mission: 用一条可验证的交付链，把需求变成有证据的产出 # 使命（L1）
  charter_ref: charter.md # 公司章程路径（相对公司目录根）
  level: 5 # 公司等级 2-9（docs/33-§3 L5 部门化）
  level_distribution: # 等级分布（骨架实数，与 people[].level 逐档相等；编制目标另见顶部双口径注记）
    2: 2
    3: 5
    4: 5
    5: 1

# 部门索引：部门领导 = 该部门 config.yaml 的 leader；部门成员 = people/ 内档案
# dept.level = 公司等级（沿 2 级模板先例）；部门嵌套深度看目录（6 根部门）
departments:
  - name: 工程部
    path: departments/工程部 # 相对本目录根；即该部门的目录
    leader: ENG-0 # 主管工号（指向 people 索引与人事档案）
    level: 5
    parent: null # 上级部门 path；根部门为 null
    lanes: [core] # 泳道 = 资源标签 + 并行开发单元（锁粒度）
    functions: [交付] # 部门职能
    relations: [] # 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}（C2-02）
  - name: 质量部
    path: departments/质量部 # 相对本目录根；即该部门的目录
    leader: QA-0
    level: 5
    parent: null # 上级部门 path；根部门为 null
    lanes: [qa] # 泳道 = 资源标签 + 并行开发单元（锁粒度）
    functions: [质量] # 部门职能
    relations: [] # 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}（C2-02）
  - name: 产品策划部
    path: departments/产品策划部 # 相对本目录根；即该部门的目录
    leader: PLN-0
    level: 5
    parent: null # 上级部门 path；根部门为 null
    lanes: [core] # 泳道 = 资源标签 + 并行开发单元（锁粒度）
    functions: [策划] # 部门职能
    relations: [] # 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}（C2-02）
  - name: 人事部
    path: departments/人事部 # 相对本目录根；即该部门的目录
    leader: HR-0
    level: 5
    parent: null # 上级部门 path；根部门为 null
    lanes: [ops] # 泳道 = 资源标签 + 并行开发单元（锁粒度）
    functions: [人事] # 部门职能
    relations: [] # 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}（C2-02）
  - name: 财务部
    path: departments/财务部 # 相对本目录根；即该部门的目录
    leader: FIN-0
    level: 5
    parent: null # 上级部门 path；根部门为 null
    lanes: [ops] # 泳道 = 资源标签 + 并行开发单元（锁粒度）
    functions: [财务] # 部门职能
    relations: [] # 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}（C2-02）
  - name: 综合部
    path: departments/综合部 # 相对本目录根；即该部门的目录
    leader: PRIME-0
    level: 5
    parent: null # 上级部门 path；根部门为 null
    lanes: [ops] # 泳道 = 资源标签 + 并行开发单元（锁粒度）
    functions: [管理, 对外, 情报] # 部门职能
    relations: [] # 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}（C2-02）

# 人员索引（只留派工索引；职责正文以人事档案为准）。name=花名（命名器确定性生成，种子冻结）
people:
  - id: PRIME-0 # 工号 = 文件名 = 永不变主键
    name: 溪笛
    login: prime-0 # YouTrack 账号锚点（账号=等级锚点，工号=人）
    level: 5
    dept: departments/综合部
    role: 总经理 # 岗位（岗位 → 模型档映射见框架级 models.yaml）
    reports_to: null # 汇报线（上级工号）
    skills: [管理] # 技能本体（内部工种映射表，不用自由文本）
    status: active # active | paused | retired（只改状态不删号，历史不悬空）
    executor: dsh # executor 偏好；缺省继承框架默认（docs/06-§三）
