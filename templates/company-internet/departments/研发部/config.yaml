# 研发部 · 部门章程与规定（互联网公司示例包）
#
# 契约依据：docs/04-§二（部门领导配置 = 本文件；leader 指向工号）

name: 研发部
path: departments/研发部
level: 3 # 部门层级 = 目录嵌套深度
parent: null # 根部门
leader: NET-1 # 主管工号（指向 people/ 内人事档案）
functions: # 部门职能
  - 交付
lanes: # 泳道：资源标签 + 并行开发单元（一泳道一 worker 一分支）
  - core # 主线：合入权在研发负责人
  - feature # 特性并行位：特性并行走 feature，不阻塞主线
reports_to: null # 汇报线：根部门为 null

# 部门规定（部门内部规则；不得与 charter.md 的红线冲突）
rules:
  - 一切交付以落盘证据为准（REPORT + 闸门 exit=0，docs/17-§6）
  - 特性并行走 feature 泳道；主线合并权在研发负责人（NET-1）
  - 一切用户可见变更必须可灰度、可回滚；无回滚方案的发布不上线（charter 第三条）
  - 在途单一律挂泳道租约，忙则顺延不抢锁

# 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}
relations: []

# 本部门名下的定时岗（清单与 org-config.yaml 的 jobs 段保持一致）
jobs:
  - net-site-patrol # 站点健康巡逻：每 10 分钟
