# Studio Next · 公司组织配置（org-config.yaml）—— company-internet（CL3 行业示例骨架（互联网公司））
#
# V2 依据（唯一主表，本文件不复制矩阵本体）：
#   - docs/v2/03 §2.2 表 A（CL2-CL9 必设矩阵）／§2.3 表 A′（保留权力：未设岗权力显式归老板）
#     ／§2.4（CL 判据=在编结构事实，「只改 level 字段」无效）／§6.2 表 E（部门 D 族：
#     Dn=负责人 Gn，D9 不启用；D3-D5 最低设立层 CL8，D6=CL6，D7=CL5，D8=CL4）／§7.2（组织变更）
#   - docs/v2/06 §5.1（拟任≠事实）／§5.2（CL 只是主张；包内不复制表 A 本体）／§六（模板=生成物源，
#     不是公司包本体；以模板初始化≠公司已设立）
#   - docs/v2/10 §4.3（SCH-ORG-01 字段表）／§3.3（schema 字面量=迁移期绑定标识，V2 替代为 schemaRef）
#
# 拟任声明（v2/06 §5.1）：本文件只登记**拟任**——最高宰相（G9）与各级人员皆为拟任安排；任命是否
# 生效、任职是否接受、谁实际在编，归记录（v2/11），不由本文件断言。设立=外部老板的设立记录＋
# root_delegation（v2/03 §3.1）；模板只产目录，不构成设立。
#
# CL 主张（v2/03 §2.4）：company.level=3 只是主张；判据=在编结构可满足的最高层判据。
# 本骨架声明 CL3 行业示例骨架（互联网公司）；结构下限（表 A CL3 行）：
#   - 最高宰相 G9（拟任）
#   - 一级单元 N≥1（默认 1）
#   - 执行成员 G2-G1 正式任职
#   - 部长 G8／中间层 G7+/部门审计制度：保留（CL3 不设）
# 保留（可不设，缺位时权力按表 A′ 显式归老板；本文件不复制表 A′ 正文）：未列出的更高岗位。
#
# 一级单元 N（GAP-V2-17；v2/06 §5.2）：N≥1，**默认 1**。N 是**设立记录参数**，不是本文件字段
# （SCH-ORG-01 无 unitCount/units 字段——docs/v2/10 §4.3；本波按记录面方案定形，MIG-05 入口；
# MIG-03 未冻结该字段）。unitCount/units[]/domain/headRef/vacancyState 的记录面承载见投影输入
# 边界（ParsedUnit），本文件不新增 YAML 键。
# 本模板结构示例 N（示例）= 1（单元域=交付（研发部班组）＋增长（增长部班组）；最高宰相直管）——**示例不是规范**：
# 「三省」N=3 只是示例；任何 N 由设立记录确认；增删单元=组织变更（v2/03 §7.2），不靠改字段。
#
# 部门结构（v2/03 §6.2 表 E）：本骨架部门等级 D2×2（两个班组：负责人 G2；CL3 下限只允许 D1/D2 部门——D3+ 有最低设立层）
# 最高宰相为**公司层岗位**（不在部门硬核内）：people[].dept 仅作派工索引挂靠，不参与部门 Dn 判定。
#
# 资产部（v2/06 §三/§4.5）：plugins/dsh-web-test 是 DSH 插件**专属资产**（84 裁决一：保留不迁出）；
# 本模板资产清单条目登记在框架仓 registry 数据面（builtinAssets：exclusive/targetExecutor=dsh/必备性/
# 来源/摘要）。assets.yaml 为目标文件位（v2/06 §4.1），随模板分发归 v2/16（现仓库规范封闭集未含该件）。
# 传播语义（v2/06 §3.4）：接收方无 dsh 执行器时该资产**明示不可用**（不冒充已装）；必备不可用由接收
# 方部署者具名二选一（拒绝装载／降级装载）。
#
# 缺口登记 DEC-OPEN-16（软阻断，未裁）：解散/清算是否纳入公司硬核**未决**——本模板与
# charter.md **不写**解散/清算条款（不预设裁决结果）；裁决落卷后按批示流补条款并留痕。
#
# 字节惰性（v2/06 §2.2／v2/10 §4.8）：全模板除 plugins/ 下 DSH 插件（资产部专属资产位）外均为
# 纯配置/人读文本，不含脚本、宿主命令、自动执行钩子、本机路径或秘密值。

schema: org-config/v1

company:
  name: 星潮互联网公司 # 公司名（公司层提示词 L1 的内容源之一）
  slug: internet-corp # 概览路由 http://<host>:8789/<slug>/...；升级通道按此认家
  mission: 用小步快跑的可度量迭代，把用户需求变成拿得出手的互联网产品 # 使命（L1）
  charter_ref: charter.md # 公司章程路径（相对公司目录根）
  level: 3 # CL 主张（判据=结构事实，v2/03 §2.4；「只改 level 字段」无效）
  level_distribution: # 拟任人数按 G 档实数（与 people[].level 逐档相等——投影规则）
    2: 3
    9: 1
  platform: localfile # 声明性平台绑定（docs/23-§二：换平台=改配置行；导入流据此走字段 provision）

# 部门索引：纵向=等级锚权限，横向=部门树；互联网公司的两轴=研发交付 + 增长运营
departments:
  - name: 研发部
    path: departments/研发部
    leader: NET-1 # 主管工号（指向 people 索引与人事档案）
    level: 2 # D2（=负责人 G2 拟任职级——v2/03 §6.2 表 E；D9 不启用）
    parent: null # 根部门
    lanes: [core, feature] # 泳道 = 资源标签 + 并行开发单元（core=主线，feature=特性并行）
    functions: [交付] # 部门职能
    relations: [] # 跨部门关系（本模板最小面；扩展形见 docs/25 DeptRelation）
  - name: 增长部
    path: departments/增长部
    leader: GRO-1 # 主管工号（指向 people 索引与人事档案）
    level: 2 # D2（=负责人 G2 拟任职级——v2/03 §6.2 表 E；D9 不启用）
    parent: null
    lanes: [growth] # 增长泳道：实验与数据并行位
    functions: [增长运营]
    relations: []

# 人员索引（只留派工索引；职责正文以 departments/**/people/<工号>.md 档案为准）
people:
  - id: NET-1 # 工号 = 文件名 = 永不变主键
    name: 全栈工程师
    login: net-eng # YouTrack 账号锚点（账号=等级锚点，工号=人）
    level: 2
    dept: departments/研发部
    role: 研发负责人
    reports_to: null
    skills: [typescript, nodejs] # 技能本体（内部工种映射表，不用自由文本）
    status: active
    executor: dsh # executor 偏好（ENU-88 执行器值集；dsh=当前唯一保证面——docs/43-§六）
    file: departments/研发部/people/NET-1.md
  - id: NET-2
    name: 前端工程师
    login: net-web
    level: 2
    dept: departments/研发部
    role: 前端工程师
    reports_to: NET-1 # 汇报线（上级工号）
    skills: [typescript, react]
    status: active
    executor: dsh
    file: departments/研发部/people/NET-2.md
  - id: GRO-1
    name: 增长运营
    login: growth-ops
    level: 2
    dept: departments/增长部
    role: 增长运营
    reports_to: null
    skills: [analytics] # 依赖清单命中位：skills 含 analytics → dsh-metrics-board（缺源=能力声明面）
    status: active
    executor: dsh
    file: departments/增长部/people/GRO-1.md
  - id: PRIME-0
    name: 最高宰相
    login: prime-0
    level: 9
    dept: departments/研发部
    role: 最高宰相
    reports_to: null
    skills: [管理]
    status: active
    executor: dsh
    file: departments/研发部/people/PRIME-0.md

# 定时岗清单（04-§三 定时岗通用模型）：互联网公司的两岗=站点巡逻 + 增长日报
jobs:
  - id: net-site-patrol # 站点健康巡逻：每 10 分钟看一次可用性与错误率
    dept: departments/研发部
    cron: "*/10 * * * *" # 本地时区
    role: 研发负责人 # 岗位（随部门负责人拟任岗位）
    level: 2 # 该岗等级（随部门负责人拟任职级）
    type: patrol # 巡逻岗：巡检在途/告警面，产出巡逻纪要（随事件留痕——无归档落点，127-A：patrol×output=结构性零产出，不声明 output）
    model_tier: low
    budget_cap: 1 # USD/次
    sla: # 岗位运作规格（docs/35-§3）：首响 10 分钟内
      first-ack: 10m
  - id: net-growth-daily # 增长日报：每日 18:30 汇总北极星指标与实验结论
    dept: departments/增长部
    triggers: # 节奏档位（与 cron 恰给其一——docs/35-§3）
      cadence: daily
      at: "18:30"
    role: 增长运营 # 岗位（随部门负责人拟任岗位）
    level: 2 # 该岗等级（随部门负责人拟任职级）
    type: report
    model_tier: low
    budget_cap: 2
    output: reports/增长部/
    outputs: [daily-growth-report] # 产出物清单（报表模板名）
    sla:
      first-ack: 30m
      resolve-hint: 4h
    grace: 2h # 新鲜度宽限（127-A R2）：越过下跑槽后宽限窗内不算停跑；缺省按 cron 密度分档（docs/35-§3）

# 单据类型流声明（DEV-43，docs/51 v1.1；127-A R3 丁案）：T:patrol=巡查岗工件流——
# 巡查工件不是工单：daemon 物化即落 delivered 终态（结构性不可派发，不烧配额）；
# 五态链满足 W-8 锚点链（物化单从不走中间态，链是给「人肉巡查单」留的完整语义）
workflows:
  types:
    - id: patrol
      states:
        - 待巡查
        - 巡查中
        - 巡毕纪要
        - 巡毕复核
        - name: 巡毕无产出
          final: true
      anchors:
        inbox: 待巡查
        dispatched: 巡查中
        evidence: 巡毕纪要
        verified: 巡毕复核
        delivered: 巡毕无产出
    # 提案类型流（130-P1，studio-dev-172；studio-dev-130 §6.1.1 规范形）：approval 锚
    # 「待批」=部长收件箱（decide 5b WAIT_APPROVAL 驻留——批示面归 P0 运行时）；
    # 打回=声明边 待批→新单（显式意图可走、引擎绝不自动走；decide 5a 自动呈批回待批）
    - id: proposal
      entity: userstory # 绑定实体=单据承载实体（与平台建单实体同源）
      states:
        - 新单
        - 待批
        - 已派发
        - 证据就绪
        - 复验通过
        - name: 已交付
          final: true
      edges:
        - from: 待批 # 打回边：部长批示「打回」→ 新单重整
          to: 新单
      anchors:
        inbox: 新单
        approval: 待批
        dispatched: 已派发
        evidence: 证据就绪
        verified: 复验通过
        delivered: 已交付

# 事件钩子声明（129-C，129-§6.1①——可选，不声明=data-change 意图面 fail-closed 不派工）：
# data-change 路由表 = 人事变更 → 联动单 assignee（变更类型七值：入/调/升/降/停/复/退）。
# 建议口径（129-§6.3 P0-A）：入/退/调 → 对账岗（人事变动唤起对账单，docs/52-§13 C1-08）；
# 升/降 → 规划线（编制调整走规划岗）。daemon.yaml `dataChangeRoutes` 可逐键覆盖（部署级逃生位）。
# 惰性面：路由只在 daemon.yaml hrPeopleWatch: true 时生效（people-change 源挂 hr-sync 分类器出口）
hooks:
  data_change:
    routes:
      入: NET-1 # 新人入司 → 对账岗收件箱自动出现对账单（P0-A 验收样板，零手工派单）
      调: NET-1
      退: NET-1
      升: NET-1
      降: NET-1
      停: NET-1
      复: NET-1

# YouTrack 账号锚点映射（账号=等级锚点，不随新增公司而新增账号）
accounts:
  - login: net-1
    level: 2 # 账号锚定的等级（与人档案的工号解耦）
    note: 研发部负责人等级锚点（拟任岗位：研发负责人）
  - login: gro-1
    level: 2 # 账号锚定的等级（与人档案的工号解耦）
    note: 增长部负责人等级锚点（拟任岗位：增长运营）
  - login: prime-0 # 最高宰相账号锚点（G9 恒定——v2/03 表 A）
    level: 9 # 账号锚定的等级（与人档案的工号解耦）
    note: 最高宰相（内部老板；拟任）

# YouTrack 字段/状态流映射覆盖（公司可整体替换；fields 供导入流 provision——docs/23）
yt:
  project: NET # 一公司一项目（N1：短名=公司代号）
  starting_number: 1
  fields:
    state: State
    dept: 部门
    level: 等级
  flows: {} # 空=走框架默认 flow_by_level 模板（docs/18-§二）
  # 类型收件态直改（130-P1，studio-dev-172）：建单落位第二优先级（显式 initialState >
  # typeInbox[type] > states[0]）。workflows 声明时 anchors.inbox 自动派生（proposal
  # 派生值=新单），此处逐键覆盖派生值（yt 同键胜出）——proposal 覆盖为待批=互查先于
  # 建单、直落部长收件箱不经新单（studio-dev-130 §6.1.2）；值域须∈声明态全集（TI-2）
  typeInbox:
    proposal: 待批

# executor 偏好覆盖（缺省继承框架级 agent.yaml；people[].executor 已逐人声明）
executors: {}
