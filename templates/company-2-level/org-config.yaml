# Studio Next · 公司组织配置（org-config.yaml）—— company-2-level（CL2 单人退化骨架）
#
# V2 依据（唯一主表，本文件不复制矩阵本体）：
#   - docs/v2/03 §2.2 表 A（CL2-CL9 必设矩阵）／§2.3 表 A′（保留权力：未设岗权力显式归老板）
#     ／§2.4（CL 判据=在编结构事实，「只改 level 字段」无效）／§6.2 表 E（部门 D 族：
#     Dn=负责人 Gn，D9 不启用；D3-D5 最低设立层 CL8，D6=CL6，D7=CL5，D8=CL4）／§7.2（组织变更）
#   - docs/v2/06 §5.1（拟任≠事实）／§5.2（CL 只是主张；包内不复制表 A 本体）／§六（模板=生成物源，
#     不是公司包本体；以模板初始化≠公司已设立）
#   - docs/v2/10 §4.3（SCH-ORG-01 字段表）／§3.3（schema 字面量=迁移期绑定标识，V2 替代为 schemaRef）
#
# 拟任声明（v2/06 §5.1）：本文件只登记**拟任**——最高宰相（G9）与各级人员皆为拟任安排；任命是否
# 生效、任职是否接受、谁实际在编，归记录（v2/11），不由本文件断言。设立=外部老板的设立记录＋
# root_delegation（v2/03 §3.1）；模板只产目录，不构成设立。
#
# CL 主张（v2/03 §2.4）：company.level=2 只是主张；判据=在编结构可满足的最高层判据。
# 本骨架声明 CL2 单人退化骨架；结构下限（表 A CL2 行）：
#   - 最高宰相 G9（拟任；在编或登记缺位均满足 CL2 第三项——表 A 表注）
#   - 一级单元 N≥1（N=1 且不单设首长时最高宰相直管——v2/03 §3.1 步 4）
#   - 执行成员 G2-G1：保留（本骨架放 1 名执行成员作 N=1 单层样例）
# 保留（可不设，缺位时权力按表 A′ 显式归老板；本文件不复制表 A′ 正文）：未列出的更高岗位。
#
# 一级单元 N（GAP-V2-17；v2/06 §5.2）：N≥1，**默认 1**。N 是**设立记录参数**，不是本文件字段
# （SCH-ORG-01 无 unitCount/units 字段——docs/v2/10 §4.3；本波按记录面方案定形，MIG-05 入口；
# MIG-03 未冻结该字段）。unitCount/units[]/domain/headRef/vacancyState 的记录面承载见投影输入
# 边界（ParsedUnit），本文件不新增 YAML 键。
# 本模板结构示例 N（示例）= 1（单元域=交付；最高宰相直管，N=1 不单设 G8 首长）——**示例不是规范**：
# 「三省」N=3 只是示例；任何 N 由设立记录确认；增删单元=组织变更（v2/03 §7.2），不靠改字段。
#
# 部门结构（v2/03 §6.2 表 E）：本骨架部门等级 D2（班组：负责人 G2，不享有部门硬核；表 A′ 行 8 权力归最高宰相）
# 最高宰相为**公司层岗位**（不在部门硬核内）：people[].dept 仅作派工索引挂靠，不参与部门 Dn 判定。
#
# CL2 单人退化（v2/06 §5.4）：本骨架=「公司形状的 agent harness」——不宣称具备完整公司的独立
# 审计与最终责任（84b 共同前提 2／85c-Q8）；价值在权责记录与公司包格式，不在调用树。
#
# 缺口登记 DEC-OPEN-16（软阻断，未裁）：解散/清算是否纳入公司硬核**未决**——本模板与
# charter.md **不写**解散/清算条款（不预设裁决结果）；裁决落卷后按批示流补条款并留痕。
#
# 字节惰性（v2/06 §2.2／v2/10 §4.8）：全模板除 plugins/ 下 DSH 插件（资产部专属资产位）外均为
# 纯配置/人读文本，不含脚本、宿主命令、自动执行钩子、本机路径或秘密值。

schema: org-config/v1 # 本文件的 schema 版本（须与 .studio-next.yaml 的 schema 一致）

company:
  name: 示例公司 # 公司名（公司层提示词 L1 的内容源之一）
  slug: example-corp # 目录 slug：概览路由 http://<host>:8789/<slug>/...
  mission: 用一条可验证的交付链，把需求变成有证据的产出 # 使命（L1）
  charter_ref: charter.md # 公司章程路径（相对公司目录根）
  level: 2 # CL 主张（判据=结构事实，v2/03 §2.4；「只改 level 字段」无效）
  level_distribution: # 拟任人数按 G 档实数（与 people[].level 逐档相等——投影规则）
    2: 1
    9: 1

# 部门索引：部门领导 = 该部门 config.yaml 的 leader；部门成员 = people/ 内档案
# 部门等级 Dn=负责人 Gn（v2/03 §6.2 表 E；D9 不启用）；嵌套深度看目录——9 层是最长链，不是每个部门都要到 9
departments:
  - name: 工程部
    path: departments/工程部 # 相对本目录根；即该部门的目录
    leader: AGENT-1 # 主管工号（指向 people 索引与人事档案）
    level: 2 # D2（=负责人 G2 拟任职级——v2/03 §6.2 表 E；D9 不启用）
    parent: null # 上级部门 path；根部门为 null
    lanes: [core] # 泳道 = 资源标签 + 并行开发单元（锁粒度）
    functions: [交付] # 部门职能
    relations: [] # 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}（C2-02）

# 人员索引（只留派工索引；职责正文以人事档案为准，悬空引用/孤儿档案双检）
people:
  - id: AGENT-1 # 工号 = 文件名 = 永不变主键
    name: 示例工程师
    login: agent-1 # YouTrack 账号锚点（账号=等级锚点，工号=人）
    level: 2
    dept: departments/工程部
    role: 工程负责人
    reports_to: null # 汇报线（上级工号）
    skills: [typescript] # 技能本体（内部工种映射表，不用自由文本）
    status: active # active | paused | retired（只改状态不删号，历史不悬空）
    executor: dsh # executor 偏好；缺省继承框架默认（docs/06-§三）
    file: departments/工程部/people/AGENT-1.md # 人事档案路径（正文在此）
  - id: PRIME-0
    name: 最高宰相
    login: prime-0
    level: 9
    dept: departments/工程部
    role: 最高宰相
    reports_to: null
    skills: [管理]
    status: active
    executor: dsh
    file: departments/工程部/people/PRIME-0.md

# 定时岗清单（定时岗通用模型）：一切唤起都是定时任务，挂在部门节点下
# 报表岗 / 财务审查 / 人事审查 / 项目审查 / 升级审查……都只是这个模型的实例，公司可自行增删
jobs:
  - id: health-patrol-工程部 # v0.4 首个定时岗样例（16-§四「健康巡检」）：5 分钟巡逻
    dept: departments/工程部
    cron: "*/5 * * * *" # 每 5 分钟（本地时区）
    role: 工程负责人 # 岗位（随部门负责人拟任岗位）
    level: 2 # 该岗等级（随部门负责人拟任职级）
    type: patrol # 巡逻岗：巡检台账/在途/心跳，产出巡逻纪要（随事件留痕——无归档落点，127-A：patrol×output=结构性零产出，不声明 output）
    model_tier: low
    budget_cap: 1 # USD/次
  - id: daily-report-工程部
    dept: departments/工程部 # 所属部门节点
    cron: "0 18 * * *" # 本地时区（cron 一律按制作人机器本地时区解析）
    role: 工程负责人 # 岗位（随部门负责人拟任岗位）
    level: 2 # 该岗等级（随部门负责人拟任职级）
    type: report # 任务类型（report | audit | ...，自由扩展，框架不写死）
    model_tier: low # 模型档：high | mid | low
    budget_cap: 2 # 预算帽（USD/次；预留-结算，超额在调用前拒绝）
    output: reports/工程部/ # 产出落点（报表按 <date>-<type>-<节点>-<总结>.md 命名）

# 单据类型流声明（DEV-43，docs/51 v1.1；127-A R3 丁案）：T:patrol=巡查岗工件流——
# 巡查工件不是工单：daemon 物化即落 delivered 终态（结构性不可派发，不烧配额）；
# 五态链满足 W-8 锚点链（物化单从不走中间态，链是给「人肉巡查单」留的完整语义）
workflows:
  types:
    - id: patrol
      states:
        - 待巡查
        - 巡查中
        - 巡毕纪要
        - 巡毕复核
        - name: 巡毕无产出
          final: true
      anchors:
        inbox: 待巡查
        dispatched: 巡查中
        evidence: 巡毕纪要
        verified: 巡毕复核
        delivered: 巡毕无产出
    # 提案类型流（130-P1，studio-dev-172；studio-dev-130 §6.1.1 规范形）：approval 锚
    # 「待批」=部长收件箱（decide 5b WAIT_APPROVAL 驻留——批示面归 P0 运行时）；
    # 打回=声明边 待批→新单（显式意图可走、引擎绝不自动走；decide 5a 自动呈批回待批）
    - id: proposal
      entity: userstory # 绑定实体=单据承载实体（与平台建单实体同源）
      states:
        - 新单
        - 待批
        - 已派发
        - 证据就绪
        - 复验通过
        - name: 已交付
          final: true
      edges:
        - from: 待批 # 打回边：部长批示「打回」→ 新单重整
          to: 新单
      anchors:
        inbox: 新单
        approval: 待批
        dispatched: 已派发
        evidence: 证据就绪
        verified: 复验通过
        delivered: 已交付
    # 策划验收位类型流（202-P1，studio-dev-231；202-§5.1 声明形）：approval 锚「待验收」
    # 居复验锚之后=验收位（呈批位之外的第二个合法 approval 槽，W-8）——复验通过的完工件
    # 由派单策划验收。验收位批示位别律（R3）：批准不查派单律（对象是已完工复验件）；
    # 合法批示人=dept leader∪组织锚∪制作人∪本单 dispatcher（镜像列 F2-07）。
    # 打回=声明回退边 待验收→已派发：机器过渡已派发（边命中）→回新单重做位→物化
    # resume 意图（cause=策划验收打回）——F1-15 既有消费门唤起原 worker 带前情重做
    # （attempt 续号、causation 链上次工时单、前情摘要含打回理由）。
    # 「待验收」与 L2「待批」异名（W-9 同款消歧考量）；生产部署按需增删类型段。
    - id: devtask
      states:
        - 新单
        - 已派发
        - 证据就绪
        - 复验通过
        - 待验收
        - name: 已交付
          final: true
      edges:
        - from: 待验收 # 验收位打回边：策划批示「打回」→ 已派发（声明回退边）
          to: 已派发
      anchors:
        inbox: 新单
        approval: 待验收
        dispatched: 已派发
        evidence: 证据就绪
        verified: 复验通过
        delivered: 已交付

# 事件钩子声明（129-C，129-§6.1①——可选，不声明=data-change 意图面 fail-closed 不派工）：
# data-change 路由表 = 人事变更 → 联动单 assignee（变更类型七值：入/调/升/降/停/复/退）。
# 建议口径（129-§6.3 P0-A）：入/退/调 → 对账岗（人事变动唤起对账单，docs/52-§13 C1-08）；
# 升/降 → 规划线（编制调整走规划岗）。daemon.yaml `dataChangeRoutes` 可逐键覆盖（部署级逃生位）。
# 惰性面：路由只在 daemon.yaml hrPeopleWatch: true 时生效（people-change 源挂 hr-sync 分类器出口）
hooks:
  data_change:
    routes:
      入: AGENT-1 # 新人入司 → 对账岗收件箱自动出现对账单（P0-A 验收样板，零手工派单）
      调: AGENT-1
      退: AGENT-1
      升: AGENT-1
      降: AGENT-1
      停: AGENT-1
      复: AGENT-1

# YouTrack 账号锚点映射（账号=等级锚点，不随新增公司而新增账号）
accounts:
  - login: agent-1
    level: 2 # 账号锚定的等级（与人档案的工号解耦）
    note: 工程部负责人等级锚点（拟任岗位：工程负责人）
  - login: prime-0 # 最高宰相账号锚点（G9 恒定——v2/03 表 A）
    level: 9 # 账号锚定的等级（与人档案的工号解耦）
    note: 最高宰相（内部老板；拟任）

# YouTrack 字段/状态流映射覆盖（全部是默认模板，公司可整体替换；此处只列覆盖项）
yt:
  project: EXAMPLE # 一公司一项目（N1：短名=公司代号）
  starting_number: 1 # 单号起始
  fields: {} # 例：{ state: State, dept: 部门, level: 等级, dispatcher: 派单人 }
  flows: {} # 状态流覆盖；为空则走框架默认的 flow_by_level 模板（docs/18-§二）
  # 类型收件态直改（130-P1，studio-dev-172）：建单落位第二优先级（显式 initialState >
  # typeInbox[type] > states[0]）。workflows 声明时 anchors.inbox 自动派生（proposal
  # 派生值=新单），此处逐键覆盖派生值（yt 同键胜出）——proposal 覆盖为待批=互查先于
  # 建单、直落部长收件箱不经新单（studio-dev-130 §6.1.2）；值域须∈声明态全集（TI-2）
  typeInbox:
    proposal: 待批
  # 州表卫生双层声明（127-C，studio-dev-127 §4.7——可选，不声明=哨兵全灵敏度/不映射）：
  # known_foreign_states: [New, Ready]   # 白名单层：已知外来态（平台历史/英文名态）——哨兵降 FOREIGN_KNOWN 观察级
  # state_mapping: { Archived: 已交付 }  # 映射层：外来态→公司态统计映射（仅统计视图，不动状态机）
  # state_mapping_audited: { Archived: 2026-01-01 }  # 启用前置审计戳：state_mapping 全键盖戳才挂载（fail-closed）

# executor 偏好覆盖（按部门/等级覆盖框架级 agent.yaml 的默认值；此处按岗位在 people[].executor 上）
executors: {}
