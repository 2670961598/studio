# 定时岗清单（定时岗通用模型）：每个根部门 2 岗——health-patrol-<部门>（巡查：结构性零产出，
# 不声明 output——127-A）＋ daily-report-<部门>（日报）；shape 沿 2 级模板。
jobs:
  - id: health-patrol-事业部A # 巡查岗：5 分钟巡逻（巡检台账/在途/心跳，随事件留痕）
    dept: departments/事业部A
    cron: "*/5 * * * *" # 每 5 分钟（本地时区）
    role: 事业部A 总经理 # 岗位（随部门负责人拟任岗位）
    level: 7 # 该岗等级（随部门负责人拟任职级）
    type: patrol # patrol×output=结构性零产出，不声明 output（127-A）
    model_tier: low
    budget_cap: 1 # USD/次
  - id: daily-report-事业部A # 日报岗：每日汇总叶子节点产出
    dept: departments/事业部A # 所属部门节点
    cron: "0 18 * * *" # 本地时区
    role: 事业部A 总经理 # 岗位（随部门负责人拟任岗位）
    level: 7 # 该岗等级（随部门负责人拟任职级）
    type: report # 任务类型（report | audit | ...，自由扩展，框架不写死）
    model_tier: low # 模型档：high | mid | low
    budget_cap: 2 # 预算帽（USD/次；预留-结算，超额在调用前拒绝）
    output: reports/事业部A/ # 产出落点（报表按 <date>-<type>-<节点>-<总结>.md 命名）
  - id: health-patrol-事业部B
    dept: departments/事业部B
    cron: "*/5 * * * *" # 每 5 分钟（本地时区）
    role: 事业部B 总经理 # 岗位（随部门负责人拟任岗位）
    level: 7 # 该岗等级（随部门负责人拟任职级）
    type: patrol
    model_tier: low
    budget_cap: 1 # USD/次
  - id: daily-report-事业部B
    dept: departments/事业部B # 所属部门节点
    cron: "0 18 * * *" # 本地时区
    role: 事业部B 总经理 # 岗位（随部门负责人拟任岗位）
    level: 7 # 该岗等级（随部门负责人拟任职级）
    type: report # 任务类型（report | audit | ...，自由扩展，框架不写死）
    model_tier: low # 模型档：high | mid | low
    budget_cap: 2 # 预算帽（USD/次；预留-结算，超额在调用前拒绝）
    output: reports/事业部B/ # 产出落点（报表按 <date>-<type>-<节点>-<总结>.md 命名）
  - id: health-patrol-人事部
