# Studio Next · 公司组织配置（org-config.yaml）—— company-9-level（控股骨架）
#
# 逐级部门表依据：docs/33-§3（L9 控股）；生成器 packages/company/src/gen-template.ts
# （结构源=level-specs.ts，花名种子=company-9-level 冻结——手改本文件会被再生成覆盖）
# 契约依据：docs/04-公司目录与等级体系.md §二；校验规则见 packages/company zod schema。
#
# 骨架口径（双口径）：编制目标 3000-10000 人、跨度 8-12——本模板只放 10 名
# 骨架（负责人＋单岗＋代表执行）；填满编制归 company create 向导（docs/36-§4 M-B）。
# 示范要点：子公司群＋控股职能（战略/资本/审计/法务）——子公司语义=独立编制边界（R1 呈批项随单）

schema: studio-next/org@1 # 本文件的 schema 版本（须与 .studio-next.yaml 的 schema 一致）

company:
  name: 示例公司 # 公司名（init 替换占位）
  slug: example-corp # 目录 slug（init 替换占位）；概览路由 http://<host>:8789/<slug>/...
  mission: 用一条可验证的交付链，把需求变成有证据的产出 # 使命（L1）
  charter_ref: charter.md # 公司章程路径（相对公司目录根）
  level: 9 # 公司等级 2-9（docs/33-§3 L9 控股）
  level_distribution: # 等级分布（骨架实数，与 people[].level 逐档相等；编制目标另见顶部双口径注记）
    6: 2
    7: 3
    8: 4
    9: 1

# 部门索引：部门领导 = 该部门 config.yaml 的 leader；部门成员 = people/ 内档案
# dept.level = 公司等级（沿 2 级模板先例）；部门嵌套深度看目录（8 根部门）
departments:
  - name: 战略部
    path: departments/战略部 # 相对本目录根；即该部门的目录
    leader: INT-0 # 主管工号（指向 people 索引与人事档案）
    level: 9
    parent: null # 上级部门 path；根部门为 null
    lanes: [intel] # 泳道 = 资源标签 + 并行开发单元（锁粒度）
    functions: [战略] # 部门职能
    relations: [] # 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}（C2-02）
  - name: 资本部
    path: departments/资本部 # 相对本目录根；即该部门的目录
    leader: CAP-0
    level: 9
    parent: null # 上级部门 path；根部门为 null
    lanes: [capital] # 泳道 = 资源标签 + 并行开发单元（锁粒度）
    functions: [资本] # 部门职能
    relations: [] # 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}（C2-02）
  - name: 审计部
    path: departments/审计部 # 相对本目录根；即该部门的目录
