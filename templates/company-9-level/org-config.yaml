# Studio Next · 公司组织配置（org-config.yaml）—— company-9-level（CL9 控股骨架）
#
# V2 依据（唯一主表，本文件不复制矩阵本体）：
#   - docs/v2/03 §2.2 表 A（CL2-CL9 必设矩阵）／§2.3 表 A′（保留权力：未设岗权力显式归老板）
#     ／§2.4（CL 判据=在编结构事实，「只改 level 字段」无效）／§6.2 表 E（部门 D 族：
#     Dn=负责人 Gn，D9 不启用；D3-D5 最低设立层 CL8，D6=CL6，D7=CL5，D8=CL4）／§7.2（组织变更）
#   - docs/v2/06 §5.1（拟任≠事实）／§5.2（CL 只是主张；包内不复制表 A 本体）／§六（模板=生成物源，
#     不是公司包本体；以模板初始化≠公司已设立）
#   - docs/v2/10 §4.3（SCH-ORG-01 字段表）／§3.3（schema 字面量=迁移期绑定标识，V2 替代为 schemaRef）
#
# 拟任声明（v2/06 §5.1）：本文件只登记**拟任**——最高宰相（G9）与各级人员皆为拟任安排；任命是否
# 生效、任职是否接受、谁实际在编，归记录（v2/11），不由本文件断言。设立=外部老板的设立记录＋
# root_delegation（v2/03 §3.1）；模板只产目录，不构成设立。
#
# CL 主张（v2/03 §2.4）：company.level=9 只是主张；判据=在编结构可满足的最高层判据。
# 本骨架声明 CL9 控股骨架；结构下限（表 A CL9 行）：
#   - 最高宰相 G9（拟任）
#   - 一级单元 N≥1（本示例 N=3；默认仍为 1）
#   - G2-G8 全链在编（CL9 判据）
#   - ≥3 个 D8 部门在编（战略/资本/审计/法务）
#   - 专职部门审计位置在编（审计部，CL7 判据）
#   - 审计全周期化（周期审计岗——audit-cycle；记录归台账 v2/11）
#   - 部门审计制度（周期记录；本骨架由 audit-cycle 定时岗承载）
# 保留（可不设，缺位时权力按表 A′ 显式归老板；本文件不复制表 A′ 正文）：未列出的更高岗位。
#
# 一级单元 N（GAP-V2-17；v2/06 §5.2）：N≥1，**默认 1**。N 是**设立记录参数**，不是本文件字段
# （SCH-ORG-01 无 unitCount/units 字段——docs/v2/10 §4.3；本波按记录面方案定形，MIG-05 入口；
# MIG-03 未冻结该字段）。unitCount/units[]/domain/headRef/vacancyState 的记录面承载见投影输入
# 边界（ParsedUnit），本文件不新增 YAML 键。
# 本模板结构示例 N（示例）= 3（单元域=子公司A/B/C（经营边界）；控股职能（战略/资本/审计/法务）为最高宰相直辖；N=3 仅示例，默认 1）——**示例不是规范**：
# 「三省」N=3 只是示例；任何 N 由设立记录确认；增删单元=组织变更（v2/03 §7.2），不靠改字段。
#
# 部门结构（v2/03 §6.2 表 E）：本骨架部门等级 D8×4（控股职能）＋D7（子公司A/B/C、A/研发部）＋D6（综合部）＋D4（A/研发部/项目组）；G2-G8 全链、嵌套深度≥3
# 最高宰相为**公司层岗位**（不在部门硬核内）：people[].dept 仅作派工索引挂靠，不参与部门 Dn 判定。
#
# 部门审计制度（CL4 起必设的周期记录）：由审计岗/公司级审计岗按周期产出审计记录（本文件只声明
# 拟任与定时岗；审计记录归台账 v2/11，审计者≠本次评价者——v2/03 §4.2/§4.3）。
#
# 缺口登记 DEC-OPEN-16（软阻断，未裁）：解散/清算是否纳入公司硬核**未决**——本模板与
# charter.md **不写**解散/清算条款（不预设裁决结果）；裁决落卷后按批示流补条款并留痕。
#
# 字节惰性（v2/06 §2.2／v2/10 §4.8）：全模板除 plugins/ 下 DSH 插件（资产部专属资产位）外均为
# 纯配置/人读文本，不含脚本、宿主命令、自动执行钩子、本机路径或秘密值。

schema: studio-next/org@1 # 本文件的 schema 版本（须与 .studio-next.yaml 的 schema 一致）

company:
  name: 示例公司 # 公司名（init 替换占位）
  slug: example-corp # 目录 slug（init 替换占位）；概览路由 http://<host>:8789/<slug>/...
  mission: 用一条可验证的交付链，把需求变成有证据的产出 # 使命（L1）
  charter_ref: charter.md # 公司章程路径（相对公司目录根）
  level: 9 # CL 主张（判据=结构事实，v2/03 §2.4；「只改 level 字段」无效）
  level_distribution: # 拟任人数按 G 档实数（与 people[].level 逐档相等——投影规则）
    2: 1
    3: 1
    4: 1
    5: 1
    6: 1
    7: 4
    8: 4
    9: 1

# 部门索引：部门领导 = 该部门 config.yaml 的 leader；部门成员 = people/ 内档案
# dept.level = Dn（=负责人 Gn；v2/03 §6.2 表 E；D9 不启用）；嵌套深度看目录（8 根部门）
departments:
  - name: 战略部
    path: departments/战略部 # 相对本目录根；即该部门的目录
    leader: INT-0 # 主管工号（指向 people 索引与人事档案）
    level: 8 # D8（=负责人 G8 拟任职级——v2/03 §6.2 表 E；D9 不启用）
    parent: null # 上级部门 path；根部门为 null
    lanes: [intel] # 泳道 = 资源标签 + 并行开发单元（锁粒度）
    functions: [战略] # 部门职能
    relations: [] # 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}（C2-02）
  - name: 资本部
    path: departments/资本部 # 相对本目录根；即该部门的目录
