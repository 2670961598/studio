# Studio Next · 公司组织配置（org-config.yaml）—— company-3-level（小团队骨架）
#
# 逐级部门表依据：docs/33-§3（L3 小团队）；生成器 packages/company/src/gen-template.ts
# （结构源=level-specs.ts，花名种子=company-3-level 冻结——手改本文件会被再生成覆盖）
# 契约依据：docs/04-公司目录与等级体系.md §二；校验规则见 packages/company zod schema。
#
# 骨架口径（双口径）：编制目标 15-25 人、跨度 4-7——本模板只放 7 名
# 骨架（负责人＋单岗＋代表执行）；填满编制归 company create 向导（docs/36-§4 M-B）。
# 示范要点：研发部一部＋综合部（人事财务单岗＋情报单岗）——最小可运转闭环

schema: studio-next/org@1 # 本文件的 schema 版本（须与 .studio-next.yaml 的 schema 一致）

company:
  name: 示例公司 # 公司名（init 替换占位）
  slug: example-corp # 目录 slug（init 替换占位）；概览路由 http://<host>:8789/<slug>/...
  mission: 用一条可验证的交付链，把需求变成有证据的产出 # 使命（L1）
  charter_ref: charter.md # 公司章程路径（相对公司目录根）
  level: 3 # 公司等级 2-9（docs/33-§3 L3 小团队）
  level_distribution: # 等级分布（骨架实数，与 people[].level 逐档相等；编制目标另见顶部双口径注记）
    1: 1
    2: 4
    3: 2

# 部门索引：部门领导 = 该部门 config.yaml 的 leader；部门成员 = people/ 内档案
# dept.level = 公司等级（沿 2 级模板先例）；部门嵌套深度看目录（2 根部门）
departments:
  - name: 研发部
    path: departments/研发部 # 相对本目录根；即该部门的目录
    leader: ENG-0 # 主管工号（指向 people 索引与人事档案）
    level: 3
    parent: null # 上级部门 path；根部门为 null
    lanes: [core, qa] # 泳道 = 资源标签 + 并行开发单元（锁粒度）
    functions: [交付, 策划, 质量] # 部门职能
    relations: [] # 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}（C2-02）
  - name: 综合部
    path: departments/综合部 # 相对本目录根；即该部门的目录
    leader: PRIME-0
    level: 3
    parent: null # 上级部门 path；根部门为 null
    lanes: [ops] # 泳道 = 资源标签 + 并行开发单元（锁粒度）
    functions: [管理, 人事, 财务, 情报] # 部门职能
    relations: [] # 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}（C2-02）

# 人员索引（只留派工索引；职责正文以人事档案为准）。name=花名（命名器确定性生成，种子冻结）
people:
  - id: PRIME-0 # 工号 = 文件名 = 永不变主键
    name: 朗窗
    login: prime-0 # YouTrack 账号锚点（账号=等级锚点，工号=人）
    level: 3
    dept: departments/综合部
    role: 总经理（负责人） # 岗位（岗位 → 模型档映射见框架级 models.yaml）
    reports_to: null # 汇报线（上级工号）
    skills: [管理] # 技能本体（内部工种映射表，不用自由文本）
    status: active # active | paused | retired（只改状态不删号，历史不悬空）
    executor: dsh # executor 偏好；缺省继承框架默认（docs/06-§三）
    file: departments/综合部/people/PRIME-0.md # 人事档案路径（正文在此）
  - id: HF-1
    name: 昭径
    login: hf-1
    level: 2
    dept: departments/综合部
    role: 人事财务（单岗）
    reports_to: PRIME-0
    skills: [人事, 财务]
    status: active
    executor: dsh
    file: departments/综合部/people/HF-1.md
  - id: INT-1
    name: 直钟
    login: int-1
    level: 2
    dept: departments/综合部
    role: 情报（单岗）
    reports_to: PRIME-0
    skills: [情报]
    status: active
    executor: dsh
    file: departments/综合部/people/INT-1.md
  - id: ENG-0
    name: 屹笛
    login: eng-0
    level: 3
    dept: departments/研发部
    role: 研发部长
    reports_to: PRIME-0
    skills: [typescript]
    status: active
    executor: dsh
    file: departments/研发部/people/ENG-0.md
  - id: PLN-1
    name: 素塔
    login: pln-1
    level: 2
    dept: departments/研发部
    role: 策划
    reports_to: ENG-0
    skills: [策划]
    status: active
    executor: dsh
    file: departments/研发部/people/PLN-1.md
  - id: ENG-1
    name: 望樵
    login: eng-1
    level: 1
    dept: departments/研发部
    role: 程序工程师
    reports_to: ENG-0
    skills: [typescript]
    status: active
    executor: dsh
    file: departments/研发部/people/ENG-1.md
  - id: QA-1
    name: 静樵
    login: qa-1
    level: 2
    dept: departments/研发部
    role: 质量工程师
    reports_to: ENG-0
    skills: [测试]
    status: active
    executor: dsh
    file: departments/研发部/people/QA-1.md

# 定时岗清单（D9 通用模型）：每个根部门 2 岗——health-patrol-<部门>（巡查：结构性零产出，
# 不声明 output——127-A）＋ daily-report-<部门>（日报）；shape 沿 2 级模板。
jobs:
  - id: health-patrol-研发部 # 巡查岗：5 分钟巡逻（巡检台账/在途/心跳，随事件留痕）
    dept: departments/研发部
    cron: "*/5 * * * *" # 每 5 分钟（本地时区）
    role: 研发部长 # 岗位
    level: 3 # 该岗等级
    type: patrol # patrol×output=结构性零产出，不声明 output（127-A）
    model_tier: low
    budget_cap: 1 # USD/次
  - id: daily-report-研发部 # 日报岗：每日汇总叶子节点产出
    dept: departments/研发部 # 所属部门节点
    cron: "0 18 * * *" # 本地时区
    role: 研发部长 # 岗位
    level: 3 # 该岗等级
    type: report # 任务类型（report | audit | ...，自由扩展，框架不写死）
    model_tier: low # 模型档：high | mid | low
    budget_cap: 2 # 预算帽（USD/次；预留-结算，超额在调用前拒绝）
    output: reports/研发部/ # 产出落点（报表按 <date>-<type>-<节点>-<总结>.md 命名）
  - id: health-patrol-综合部
    dept: departments/综合部
    cron: "*/5 * * * *" # 每 5 分钟（本地时区）
    role: 总经理（负责人） # 岗位
    level: 3 # 该岗等级
    type: patrol
    model_tier: low
    budget_cap: 1 # USD/次
  - id: daily-report-综合部
    dept: departments/综合部 # 所属部门节点
    cron: "0 18 * * *" # 本地时区
    role: 总经理（负责人） # 岗位
    level: 3 # 该岗等级
    type: report # 任务类型（report | audit | ...，自由扩展，框架不写死）
    model_tier: low # 模型档：high | mid | low
    budget_cap: 2 # 预算帽（USD/次；预留-结算，超额在调用前拒绝）
    output: reports/综合部/ # 产出落点（报表按 <date>-<type>-<节点>-<总结>.md 命名）

# YouTrack 账号锚点映射（账号=等级锚点，不随新增公司而新增账号）——根部门负责人
accounts:
  - login: eng-0
    level: 3 # 账号锚定的等级（与人档案的工号解耦）
    note: 研发部长（研发部负责人）
  - login: prime-0
    level: 3 # 账号锚定的等级（与人档案的工号解耦）
    note: 总经理（负责人）（综合部负责人）
