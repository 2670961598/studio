# 综合部 · 部门章程与规定
#
# 契约依据：docs/04-§二（部门领导配置 = 本文件；leader 指向工号）
# V2 依据：docs/v2/03 §6.2（Dn=负责人 Gn，D9 不启用；D3-D5 最低设立层 CL8）/§6.3（部门硬核
# 由部长上一层批准与保管，部长只改软外围）/§2.3 表 A′（未设岗权力显式归老板，不悬空）。
# 生成来源：company-3-level（CL3 小团队骨架；结构=负责人职级决定部门 D 级——v2/03 §6.2 表 E）

name: 综合部
path: departments/综合部
level: 2 # 部门等级 D2（=负责人 G2 拟任职级；v2/03 §6.2 表 E；D9 不启用）
parent: null # 上级部门 path（根部门为 null）
leader: HF-1 # 主管工号（指向 people/ 内人事档案）
functions: # 部门职能
  - 管理
  - 人事
  - 财务
  - 情报
lanes: # 泳道：资源标签 + 并行开发单元（一泳道一 worker 一分支）
  - ops
reports_to: null # 汇报线：本部门向哪个节点汇报（根部门为 null）

# 部门规定（部门内部规则；不得与 charter.md 的红线冲突）
rules:
  - 一切交付以落盘证据为准（REPORT + 闸门 exit=0）
  - 在途单一律挂泳道租约，忙则顺延不抢锁
  - 跨部门协作按 relations 走（relations 由公司落成后按需增补）

# 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}
relations: []

# 本部门名下的定时岗（清单与 org-config.yaml 的 jobs 段保持一致）
jobs:
  - health-patrol-综合部
  - daily-report-综合部 # 日报岗：每日汇总叶子节点产出（定时岗通用模型的一个实例）
