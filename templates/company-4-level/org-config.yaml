# Studio Next · 公司组织配置（org-config.yaml）—— company-4-level（CL4 团队骨架）
#
# V2 依据（唯一主表，本文件不复制矩阵本体）：
#   - docs/v2/03 §2.2 表 A（CL2-CL9 必设矩阵）／§2.3 表 A′（保留权力：未设岗权力显式归老板）
#     ／§2.4（CL 判据=在编结构事实，「只改 level 字段」无效）／§6.2 表 E（部门 D 族：
#     Dn=负责人 Gn，D9 不启用；D3-D5 最低设立层 CL8，D6=CL6，D7=CL5，D8=CL4）／§7.2（组织变更）
#   - docs/v2/06 §5.1（拟任≠事实）／§5.2（CL 只是主张；包内不复制表 A 本体）／§六（模板=生成物源，
#     不是公司包本体；以模板初始化≠公司已设立）
#   - docs/v2/10 §4.3（SCH-ORG-01 字段表）／§3.3（schema 字面量=迁移期绑定标识，V2 替代为 schemaRef）
#
# 拟任声明（v2/06 §5.1）：本文件只登记**拟任**——最高宰相（G9）与各级人员皆为拟任安排；任命是否
# 生效、任职是否接受、谁实际在编，归记录（v2/11），不由本文件断言。设立=外部老板的设立记录＋
# root_delegation（v2/03 §3.1）；模板只产目录，不构成设立。
#
# CL 主张（v2/03 §2.4）：company.level=4 只是主张；判据=在编结构可满足的最高层判据。
# 本骨架声明 CL4 团队骨架；结构下限（表 A CL4 行）：
#   - 最高宰相 G9（拟任）
#   - 一级单元 N≥1（默认 1）
#   - 执行成员 G2-G1 正式任职
#   - 首个 D8 部门与 G8 部长在编（CL4 判据）
#   - 部门审计制度（周期记录；本骨架由 audit-cycle 定时岗承载）
# 保留（可不设，缺位时权力按表 A′ 显式归老板；本文件不复制表 A′ 正文）：未列出的更高岗位。
#
# 一级单元 N（GAP-V2-17；v2/06 §5.2）：N≥1，**默认 1**。N 是**设立记录参数**，不是本文件字段
# （SCH-ORG-01 无 unitCount/units 字段——docs/v2/10 §4.3；本波按记录面方案定形，MIG-05 入口；
# MIG-03 未冻结该字段）。unitCount/units[]/domain/headRef/vacancyState 的记录面承载见投影输入
# 边界（ParsedUnit），本文件不新增 YAML 键。
# 本模板结构示例 N（示例）= 1（单元域=交付（研发部 D8）＋支撑（综合部班组）；最高宰相直管）——**示例不是规范**：
# 「三省」N=3 只是示例；任何 N 由设立记录确认；增删单元=组织变更（v2/03 §7.2），不靠改字段。
#
# 部门结构（v2/03 §6.2 表 E）：本骨架部门等级 D8（研发部：负责人 G8）＋D2（综合部班组）；D3-D5 最低设立层 CL8，本层不设
# 最高宰相为**公司层岗位**（不在部门硬核内）：people[].dept 仅作派工索引挂靠，不参与部门 Dn 判定。
#
# 部门审计制度（CL4 起必设的周期记录）：由审计岗/公司级审计岗按周期产出审计记录（本文件只声明
# 拟任与定时岗；审计记录归台账 v2/11，审计者≠本次评价者——v2/03 §4.2/§4.3）。
#
# 缺口登记 DEC-OPEN-16（软阻断，未裁）：解散/清算是否纳入公司硬核**未决**——本模板与
# charter.md **不写**解散/清算条款（不预设裁决结果）；裁决落卷后按批示流补条款并留痕。
#
# 字节惰性（v2/06 §2.2／v2/10 §4.8）：全模板除 plugins/ 下 DSH 插件（资产部专属资产位）外均为
# 纯配置/人读文本，不含脚本、宿主命令、自动执行钩子、本机路径或秘密值。

schema: studio-next/org@1 # 本文件的 schema 版本（须与 .studio-next.yaml 的 schema 一致）

company:
  name: 示例公司 # 公司名（init 替换占位）
  slug: example-corp # 目录 slug（init 替换占位）；概览路由 http://<host>:8789/<slug>/...
  mission: 用一条可验证的交付链，把需求变成有证据的产出 # 使命（L1）
  charter_ref: charter.md # 公司章程路径（相对公司目录根）
  level: 4 # CL 主张（判据=结构事实，v2/03 §2.4；「只改 level 字段」无效）
  level_distribution: # 拟任人数按 G 档实数（与 people[].level 逐档相等——投影规则）
    1: 1
    2: 2
    3: 1
    4: 2
    5: 1
    6: 1
    8: 1
    9: 1

# 部门索引：部门领导 = 该部门 config.yaml 的 leader；部门成员 = people/ 内档案
# dept.level = Dn（=负责人 Gn；v2/03 §6.2 表 E；D9 不启用）；嵌套深度看目录（2 根部门）
departments:
  - name: 研发部
    path: departments/研发部 # 相对本目录根；即该部门的目录——内设策划组/程序组/QA 组——组≠部门（不进部门树，人档案归属即组）
    leader: ENG-0 # 主管工号（指向 people 索引与人事档案）
    level: 8 # D8（=负责人 G8 拟任职级——v2/03 §6.2 表 E；D9 不启用）
    parent: null # 上级部门 path；根部门为 null
    lanes: [core, qa] # 泳道 = 资源标签 + 并行开发单元（锁粒度）
    functions: [交付, 策划, 质量] # 部门职能
    relations: [] # 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}（C2-02）
  - name: 综合部
    path: departments/综合部 # 相对本目录根；即该部门的目录
    leader: HR-1 # 主管工号（指向 people 索引与人事档案）
    level: 2 # D2（=负责人 G2 拟任职级——v2/03 §6.2 表 E；D9 不启用）
    parent: null # 上级部门 path；根部门为 null
    lanes: [ops] # 泳道 = 资源标签 + 并行开发单元（锁粒度）
    functions: [管理, 人事, 财务, 情报] # 部门职能
    relations: [] # 跨部门关系：{to, type∈联签|下游交付|共享泳道, protocol}（C2-02）

# 人员索引（只留派工索引；职责正文以人事档案为准）。name=花名（命名器确定性生成，种子冻结）
people:
  - id: PRIME-0 # 工号 = 文件名 = 永不变主键
    name: 白原
    login: prime-0 # YouTrack 账号锚点（账号=等级锚点，工号=人）
    level: 9
    dept: departments/综合部
    role: 最高宰相
    reports_to: null # 汇报线（上级工号）
    skills: [管理] # 技能本体（内部工种映射表，不用自由文本）
    status: active # active | paused | retired（只改状态不删号，历史不悬空）
    executor: dsh # executor 偏好；缺省继承框架默认（docs/06-§三）
    file: departments/综合部/people/PRIME-0.md # 人事档案路径（正文在此）
  - id: HR-1
    name: 云隼
    login: hr-1
    level: 2
    dept: departments/综合部
    role: 人事（单岗）
    reports_to: PRIME-0
    skills: [人事]
    status: active
    executor: dsh
    file: departments/综合部/people/HR-1.md
  - id: FIN-1
    name: 屹林
    login: fin-1
    level: 3
    dept: departments/综合部
    role: 财务（单岗）
    reports_to: PRIME-0
    skills: [财务]
    status: active
    executor: dsh
    file: departments/综合部/people/FIN-1.md
  - id: INT-1
    name: 昭石
    login: int-1
    level: 4
    dept: departments/综合部
    role: 情报（单岗）
    reports_to: PRIME-0
    skills: [情报]
    status: active
    executor: dsh
    file: departments/综合部/people/INT-1.md
  - id: ENG-0
    name: 湛潮
    login: eng-0
    level: 8
    dept: departments/研发部
    role: 研发部长
    reports_to: PRIME-0
    skills: [typescript]
    status: active
    executor: dsh
    file: departments/研发部/people/ENG-0.md
  - id: PLN-1
    name: 煦杉
    login: pln-1
    level: 4
    dept: departments/研发部
    role: 策划组长
    reports_to: ENG-0
    skills: [策划]
    status: active
    executor: dsh
    file: departments/研发部/people/PLN-1.md
  - id: ENG-1
    name: 川樵
    login: eng-1
    level: 6
    dept: departments/研发部
    role: 程序组长
    reports_to: ENG-0
    skills: [typescript]
    status: active
    executor: dsh
    file: departments/研发部/people/ENG-1.md
  - id: ENG-2
    name: 屿井
    login: eng-2
    level: 2
    dept: departments/研发部
    role: 程序工程师
    reports_to: ENG-1
    skills: [typescript]
    status: active
    executor: dsh
    file: departments/研发部/people/ENG-2.md
  - id: QA-1
    name: 拾檐
    login: qa-1
    level: 5
    dept: departments/研发部
    role: 质量组长
    reports_to: ENG-0
    skills: [测试]
    status: active
    executor: dsh
    file: departments/研发部/people/QA-1.md
  - id: QA-2
    name: 叙杉
    login: qa-2
    level: 1
    dept: departments/研发部
    role: 质量工程师
    reports_to: QA-1
    skills: [测试]
    status: active
    executor: dsh
    file: departments/研发部/people/QA-2.md

# 定时岗清单（定时岗通用模型）：每个根部门 2 岗——health-patrol-<部门>（巡查：结构性零产出，
# 不声明 output——127-A）＋ daily-report-<部门>（日报）；shape 沿 2 级模板。
jobs:
  - id: health-patrol-研发部 # 巡查岗：5 分钟巡逻（巡检台账/在途/心跳，随事件留痕）
    dept: departments/研发部
    cron: "*/5 * * * *" # 每 5 分钟（本地时区）
    role: 研发部长 # 岗位（随部门负责人拟任岗位）
    level: 8 # 该岗等级（随部门负责人拟任职级）
    type: patrol # patrol×output=结构性零产出，不声明 output（127-A）
    model_tier: low
    budget_cap: 1 # USD/次
  - id: daily-report-研发部 # 日报岗：每日汇总叶子节点产出
    dept: departments/研发部 # 所属部门节点
    cron: "0 18 * * *" # 本地时区
    role: 研发部长 # 岗位（随部门负责人拟任岗位）
    level: 8 # 该岗等级（随部门负责人拟任职级）
    type: report # 任务类型（report | audit | ...，自由扩展，框架不写死）
    model_tier: low # 模型档：high | mid | low
    budget_cap: 2 # 预算帽（USD/次；预留-结算，超额在调用前拒绝）
    output: reports/研发部/ # 产出落点（报表按 <date>-<type>-<节点>-<总结>.md 命名）
  - id: health-patrol-综合部
    dept: departments/综合部
    cron: "*/5 * * * *" # 每 5 分钟（本地时区）
    role: 人事（单岗） # 岗位（随部门负责人拟任岗位）
    level: 2 # 该岗等级（随部门负责人拟任职级）
    type: patrol
    model_tier: low
    budget_cap: 1 # USD/次
  - id: daily-report-综合部
    dept: departments/综合部 # 所属部门节点
    cron: "0 18 * * *" # 本地时区
    role: 人事（单岗） # 岗位（随部门负责人拟任岗位）
    level: 2 # 该岗等级（随部门负责人拟任职级）
    type: report # 任务类型（report | audit | ...，自由扩展，框架不写死）
    model_tier: low # 模型档：high | mid | low
    budget_cap: 2 # 预算帽（USD/次；预留-结算，超额在调用前拒绝）
    output: reports/综合部/ # 产出落点（报表按 <date>-<type>-<节点>-<总结>.md 命名）

# YouTrack 账号锚点映射（账号=等级锚点，不随新增公司而新增账号）——根部门负责人
  - id: audit-cycle-综合部 # 部门审计制度（CL4 起必设的周期记录；审计者≠本次评价者——v2/03 §4.2/§4.3）
    dept: departments/综合部
    triggers:
      cadence: monthly
      at: "05:00"
    role: 最高宰相
    level: 9
    type: audit # 审计周期岗：周期记录入台账（记录面归 v2/11；岗位只声明拟任）
    model_tier: low
    budget_cap: 2 # 预算帽（USD/次；预留-结算）
    output: reports/综合部/ # 产出落点

accounts:
  - login: eng-0
    level: 8 # 账号锚定的等级（与人档案的工号解耦）
    note: 研发部负责人等级锚点（拟任岗位：研发部长）
  - login: hr-1
    level: 2 # 账号锚定的等级（与人档案的工号解耦）
    note: 综合部负责人等级锚点（拟任岗位：人事（单岗））
  - login: prime-0 # 最高宰相账号锚点（G9 恒定——v2/03 表 A）
    level: 9 # 账号锚定的等级（与人档案的工号解耦）
    note: 最高宰相（内部老板；拟任）
